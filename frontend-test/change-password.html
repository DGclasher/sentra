<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentra Change Password</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 520px;
        margin: 80px auto;
        padding: 20px;
      }

      h1 {
        margin-bottom: 24px;
      }

      input {
        width: 100%;
        padding: 10px;
        margin: 8px 0 16px;
        box-sizing: border-box;
      }

      button {
        width: 100%;
        padding: 12px;
        cursor: pointer;
      }

      pre {
        margin-top: 20px;
        padding: 12px;
        background: #f5f5f5;
        white-space: pre-wrap;
        word-break: break-word;
        overflow-x: auto;
      }

      a {
        display: inline-block;
        margin-top: 16px;
      }
    </style>
  </head>

  <body>
    <h1>Choose a New Password</h1>

    <form id="changePasswordForm">
      <label for="newPassword">New password</label>
      <input
        id="newPassword"
        type="password"
        required
        autocomplete="new-password"
      />

      <label for="confirmPassword">Confirm new password</label>
      <input
        id="confirmPassword"
        type="password"
        required
        autocomplete="new-password"
      />

      <button id="changePasswordButton" type="submit">Change Password</button>
    </form>

    <pre id="result"></pre>
    <a href="login.html">Return to login</a>

    <script src="auth.js"></script>
    <script>
      const challengeSession = sessionStorage.getItem(
        "cognito_challenge_session",
      );
      const username = sessionStorage.getItem("cognito_username");

      const changePasswordForm = document.getElementById("changePasswordForm");
      const changePasswordButton = document.getElementById(
        "changePasswordButton",
      );
      const result = document.getElementById("result");

      if (!challengeSession || !username) {
        changePasswordForm.style.display = "none";
        result.textContent =
          "This password-change session is missing or expired. Return to login and try again.";
      }

      changePasswordForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!challengeSession || !username) {
          return;
        }

        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;

        if (newPassword !== confirmPassword) {
          result.textContent = "The passwords do not match.";
          return;
        }

        result.textContent = "Changing password...";
        changePasswordButton.disabled = true;

        try {
          const response = await fetch(SentraAuth.COGNITO_ENDPOINT, {
            method: "POST",
            headers: {
              "Content-Type": "application/x-amz-json-1.1",
              "X-Amz-Target":
                "AWSCognitoIdentityProviderService.RespondToAuthChallenge",
            },
            body: JSON.stringify({
              ChallengeName: "NEW_PASSWORD_REQUIRED",
              ClientId: SentraAuth.COGNITO_CLIENT_ID,
              Session: challengeSession,
              ChallengeResponses: {
                USERNAME: username,
                NEW_PASSWORD: newPassword,
              },
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(
              data.message ||
                data.Message ||
                "Cognito could not change the password",
            );
          }

          if (!data.AuthenticationResult) {
            throw new Error("Cognito did not return authentication tokens");
          }

          SentraAuth.storeTokens(data.AuthenticationResult);
          sessionStorage.removeItem("cognito_challenge_session");
          sessionStorage.removeItem("cognito_username");

          result.textContent =
            "Password changed successfully.\n\n" + "Calling API Gateway...";

          const { response: apiResponse, data: apiData } =
            await SentraAuth.callApi();

          if (!apiResponse.ok) {
            result.textContent = JSON.stringify(
              {
                message:
                  "Password changed, but API Gateway rejected the request",
                status: apiResponse.status,
                response: apiData,
              },
              null,
              2,
            );
            return;
          }

          result.textContent = JSON.stringify(
            {
              message:
                "Password changed and API Gateway authentication successful",
              api_gateway_response: apiData,
            },
            null,
            2,
          );
        } catch (error) {
          result.textContent = `Password change failed: ${error.message}`;
        } finally {
          changePasswordButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
