name: Ticket Service Test and Build

on:
  push:
    branches:
      - main
    paths:
      - "services/ticket/**"
  pull_request:
    branches:
      - main
    paths:
      - "services/ticket/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test Ticket Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/ticket
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run pytest
        working-directory: services/ticket
        run: python -m pytest -q

  build:
    name: Build and Push Ticket Service Image
    needs: test
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read current image version
        id: version
        env:
          VERSION_HUB_USERNAME: ${{ secrets.VERSION_HUB_USERNAME }}
          VERSION_HUB_PASSWORD: ${{ secrets.VERSION_HUB_PASSWORD }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            --user "$VERSION_HUB_USERNAME:$VERSION_HUB_PASSWORD" \
            "https://version-hub.vercel.app/projects/sentra-ticket-service/version")
          current_version=$(printf '%s' "$response" | jq -er '.current_version')
          echo "current_version=$current_version" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        working-directory: services/ticket
        env:
          VERSION: ${{ steps.version.outputs.current_version }}
        run: |
          set -euo pipefail

          version="${VERSION#v}"
          image="dgclasher/sentra-ticket-service"

          docker build \
            --tag "$image:v$version" \
            --tag "$image:latest" \
            .

      - name: Push versioned image
        env:
          VERSION: ${{ steps.version.outputs.current_version }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          docker push "dgclasher/sentra-ticket-service:v$version"

      - name: Push latest image
        run: docker push dgclasher/sentra-ticket-service:latest

      - name: Update image version
        env:
          VERSION_HUB_USERNAME: ${{ secrets.VERSION_HUB_USERNAME }}
          VERSION_HUB_PASSWORD: ${{ secrets.VERSION_HUB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Updating version after publishing version ${{ steps.version.outputs.current_version }}"
          curl --fail-with-body --silent --show-error \
            --user "$VERSION_HUB_USERNAME:$VERSION_HUB_PASSWORD" \
            -X POST \
            "https://version-hub.vercel.app/projects/sentra-ticket-service/version"
